[project]
name = "pulsecrawl-research"
version = "0.1.0"
description = "Reproducible research harness and controlled web benchmark for PulseCrawl"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pulsecrawl[workspace]==0.1.0"]

[project.optional-dependencies]
baselines = [
    "scrapy>=2.13,<3",
    "crawlee[beautifulsoup]>=1.0,<2",
]
datalake = [
    "duckdb>=1.0",
    "pyarrow>=17.0",
]
dev = [
    "pypdf>=6.10,<7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
all = [
    "pypdf>=6.10,<7",
    "scrapy>=2.13,<3",
    "crawlee[beautifulsoup]>=1.0,<2",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.scripts]
pulsecrawl-research = "pulsecrawl_research.cli:main"
pulsecrawl-webbench = "pulsecrawl_research.webbench:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/pulsecrawl_research"]
